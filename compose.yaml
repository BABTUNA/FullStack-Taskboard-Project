services:
  database:
    image: postgres:14-alpine
    env_file: .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./server/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
  server:
    build: ./server
    env_file: .env
    depends_on:
      - database
  client:
    build: ./client
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  postgres-data:
